{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Nexo Store{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'productos:inicio' %}">
        <img src="{% static 'images/logo.svg' %}" width="38" height="38" alt="Logotipo Nexo Store">
        <span>Nexo Store</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Abrir navegación"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{% url 'productos:inicio' %}">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'productos:catalogo' %}">Catálogo</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'usuarios:perfil' %}">Nosotros</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main>{% block content %}{% endblock %}</main>
  <footer class="py-4 mt-5">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
      <span>© 2026 Nexo Store</span><span>Ignacio Salinas y Diego Pérez</span>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
